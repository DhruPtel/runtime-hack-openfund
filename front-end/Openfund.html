function renderDecision(){const d=data.decision;return `${heading(d,`<div class="heading-meta"><strong>${esc(data.app.decisionId)}</strong> · Before risk review<br>Snapshot ${esc(short(data.app.snapshotHash))} · Block ${num(data.app.snapshotBlock)}</div>`)}<div class="stat-grid">${stat('Assets reviewed',d.rows.length,'One frozen snapshot','layers')}${stat('Price-trend contribution',d.trendContribution+'%','Directional call weight','sum')}${stat('Macro contribution',d.macroContribution+'%','Directional call weight','sum')}${stat('Rounding residual',money(d.residual),'No value lost between allocations','check')}</div><div class="card"><div class="card-head"><div><h2>Proposed allocation</h2><p>Execution and integrity flag feasibility; they add no directional weight.</p></div>${badge('Before risk review','gray')}</div><div class="table-wrap"><table class="allocation-table" aria-label="Calls and portfolio weights"><thead><tr>${['Asset','Price trend','Macro','Execution','Integrity','Score','Current','Proposed','Dollar move'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr data-select-asset="${esc(r.asset)}" tabindex="0" aria-label="Trace ${esc(r.asset)} target weight" class="${selectedAsset===r.asset?'selected':''}"><td class="strong">${esc(r.asset)}</td>${['trend','macro','execution','integrity'].map(k=>`<td class="asset-call">${esc(r[k].call)} / ${score(r[k].score)}</td>`).join('')}<td>${score(r.score)}</td><td>${r.current}%</td><td>${r.target}%</td><td>${signedMoney(r.move)}</td></tr>`).join('')}<tr><td>Cash / Unallocated balance</td><td colspan="5">—</td><td>${d.cash.current}%</td><td>${d.cash.target}%</td><td>${signedMoney(d.cash.move)}</td></tr><tr><td>Rounding residual</td><td colspan="7">—</td><td>${money(d.residual)}</td></tr></tbody></table></div><p class="table-note">Select an asset to trace its proposed weight back to the signed calls.</p></div><div class="trace-grid" id="decision-trace">${renderTrace()}</div>`}

function renderRecord(){const d=data.record;return `${heading(d)}<div class="stat-grid">${stat('One complete record',money(d.price),'One record · One payment','record')}${stat('Signed analyst reports',d.signedReports,'Original independent reasoning','agents')}${stat('Approved order',d.approved,'Included with its execution receipt','check')}${stat('Veto preserved',d.vetoed,'Refusal is part of the record','x',true)}</div><div class="grid record-split"><div class="stack"><div class="card"><div class="card-head"><h2>Decision records</h2><span class="small muted">1 record</span></div><button class="record-selected" data-action="record-details"><div><strong>${esc(d.id)}</strong><p>${esc(d.headline)}</p><p class="muted">${esc(data.app.timestamp)}</p></div><span aria-hidden="true">›</span></button></div><div class="card"><h2>Free preview</h2><ul class="preview-list">${d.preview.map(x=>`<li><div><strong>${esc(x.title)}</strong><span class="muted">${esc(x.description)}</span></div></li>`).join('')}</ul><div class="row-divider"></div><p class="preview-quote">“${esc(d.quote)}”</p><p class="small muted" style="margin-top:10px">Risk verdict · Preview excerpt</p></div></div><div class="card dark record-panel"><div class="section-label">Signed decision record</div><h2>${esc(d.id)}</h2><p>${esc(d.headline)}</p><div style="margin-top:13px">${badge('✓ Signature verified')}</div><div class="record-payload"><div class="record-metadata">${metadata([['Snapshot',hash(d.snapshot)],['Signed by',hash(d.signer)],['Signature',hash(d.signature)],['Payload hash',hash(d.payloadHash)]])}<div class="button-row"><button class="text-btn" data-action="verify-record">View full signature ↗</button><button class="text-btn" data-action="record-details">Inspect record</button></div><div class="row-divider"></div><h3 style="font-size:14px">Proposed orders</h3><div class="small" style="margin-top:15px">${data.risk.orders.map(o=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0"><span>${esc(o.asset)} · ${esc(o.side)} ${money(o.amount,0)}</span>${badge(o.status,o.status==='vetoed'?'red':'purple')}</div>`).join('')}</div></div><div class="record-purchase"><h3>${recordUnlocked?'Demo record unlocked':'Unlock the complete record'}</h3><div class="record-price">${money(d.price)}</div><p class="small muted">One record · One payment</p><ul class="inclusions">${d.included.map(x=>`<li><span class="check">✓</span><span>${esc(x)}</span></li>`).join('')}</ul>${btn(recordUnlocked?'Download demo record ↓':'Unlock full record — '+money(d.price),recordUnlocked?'download-record':'checkout','block')}<p class="tiny muted" style="margin-top:15px">${esc(d.format)}</p></div></div></div></div><div class="card endpoint"><h3>For agents</h3><div class="endpoint-copy"><div class="endpoint-url"><span><strong>GET</strong> &nbsp; ${esc(d.endpoint)}</span><button class="text-btn" data-copy="${esc(d.endpoint)}" aria-label="Copy agent endpoint">Copy</button></div><p>Request → ${money(d.price)} payment required → Pay → Receive the signed record.</p></div><span class="tiny muted">Illustrative endpoint</span></div>`}
function renderChain(){const d=data.chain,swaps=d.swaps||[],swap=swaps[selectedSwap]||swaps[0]||{};return `${heading(d)}<div class="stat-grid">${stat('Confirmed swaps',swaps.length,'Each read from its own receipt','check')}${stat('Network',esc(data.app.network),esc(data.app.mode)+' · chain 4663','layers')}${stat('Reference price',money(d.referencePrice),esc(d.referenceReason||''),'value')}${stat('Latest block',num(d.block),esc(d.timestamp),'chain')}</div><div class="grid split"><div class="stack"><div class="card"><div class="card-head"><h2>Every real swap</h2></div><div class="order-list">${swaps.map((w,i)=>`<button class="order-item ${i===selectedSwap?'selected':''}" data-select-swap="${i}"><div><div class="order-asset">${esc(w.gave)} ${esc(w.gaveSymbol)} swapped</div><div class="order-context">Block ${num(w.block)} · ${esc(w.timestamp)}</div></div>${badge('✓ Confirmed')}</button>`).join('')}</div></div><div class="card"><h2>Only the treasurer can spend.</h2><p class="muted" style="margin-top:13px;line-height:1.8">${esc(d.authority)}</p></div></div><div class="card dark"><div class="card-head"><h2 style="font-size:27px">${esc(swap.gave)} ${esc(swap.gaveSymbol)} swapped</h2>${badge('✓ Confirmed from its receipt')}</div><p class="small muted">${esc(d.paperNote||'')}</p><div class="row-divider"></div><div class="transaction-table">${metadata([['Transaction',hash(swap.transaction)],['Fund wallet',hash(swap.wallet)],['Network',esc(data.app.network)+' · '+esc(data.app.mode)],['Included in block',num(swap.block)],['Confirmed at',esc(swap.timestamp)],['Gas','Sponsored by the bundler'],['Authorised by',esc(swap.instruction)],['Decision',esc(d.decisionReason||'—')]])}</div><div class="button-row">${btn('View in block explorer ↗','explorer')}${btn('View fund wallet','wallet-explorer','outline')}</div></div></div><div class="card chain-changes"><h3>What changed</h3>${swaps.map(w=>`<div class="chain-change"><span>${esc(w.gaveSymbol)} · block ${num(w.block)}</span><strong>${esc(w.gave)} ${esc(w.gaveSymbol)} out</strong></div>`).join('')}</div>`}

/* FLOW STATE + SVG. Timers update text only, so active path motion stays smooth. */
function freshCycle(){return {running:false,stage:-1,status:'idle',startTime:0,elapsed:0,nodes:{snapshot:{status:'waiting',elapsed:0},...Object.fromEntries(data.swarm.agents.map(a=>[a.id,{status:'waiting',elapsed:0}])),aggregate:{status:'waiting',elapsed:0},risk:{status:'waiting',elapsed:0},treasurer:{status:'waiting',elapsed:0},chain:{status:'waiting',elapsed:0}},orders:{}}}
let cycle=freshCycle(),timelineTimer=null,tickTimer=null,eventIndex=0;
function nodeTime(id){const n=cycle.nodes[id];return n.status==='thinking'?Math.max(0,(cycle.elapsed-n.started)/1000):n.elapsed||0}
function flowPath(id,d,status='waiting',arrow=true){return `<path id="path-${id}" class="connector ${status}" d="${d}"${arrow?` marker-end="url(#arrow-${status==='done'||status==='active'?'purple':'pending'})"`:''}/>`}
function statusFor(id){const s=cycle.nodes[id].status;return s==='done'?'done':s==='thinking'?'active':'waiting'}
function svgText(x,y,s,cls='node-meta',extra=''){return `<text x="${x}" y="${y}" class="${cls}" ${extra}>${esc(s)}</text>`}
function stageNode(id,x,y,w,h,title,desc,opts={}){const n=cycle.nodes[id]||{status:'waiting',elapsed:0},focus=opts.focus,extra=opts.extra||'',status=opts.status||n.status;const autoChip=opts.chip==='auto',chipPrefix=n.status==='done'?'Done · ':n.status==='thinking'?'Working · ':'';const chipText=autoChip?(n.status==='waiting'?'Waiting':chipPrefix+elapsed(nodeTime(id))):opts.chip;return `<g class="node ${status==='thinking'?'active':status==='done'?'complete':'waiting'} ${focus?'focus':''} ${extra}" ${opts.action?`role="button" tabindex="0" data-action="${opts.action}" aria-label="${esc(title)} details"`:''}><rect class="node-surface" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>${svgText(x+17,y+24,title,'node-title')}${svgText(x+17,y+h-13,desc,opts.mono?'node-wallet':'node-meta')}${opts.chip?`<rect class="node-chip" x="${x+w-128}" y="${y+12}" width="113" height="24" rx="7"/>${svgText(x+w-71,y+28,chipText,'node-chip-text',`text-anchor="middle" ${autoChip&&n.status!=='waiting'?`data-elapsed="${id}" data-prefix="${chipPrefix}"`:''}`)}`:''}${opts.elapsed?svgText(x+w-17,y+h-13,elapsed(nodeTime(id)),'node-time',`text-anchor="end" data-elapsed="${id}"`):''}</g>`}
function renderFlow(){const c=cycle,n=c.nodes,vetoOrder=data.risk.orders.find(o=>o.status==='vetoed'),approvedOrder=data.risk.orders.find(o=>o.status==='approved'),allDone=data.swarm.agents.every(a=>n[a.id].status==='done'),someThinking=data.swarm.agents.some(a=>n[a.id].status==='thinking');let s=`<svg class="flow-svg" viewBox="0 0 1440 590" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Openfund cycle: snapshot, independent analysts, aggregation, risk and execution</title><desc id="flow-desc">One frozen snapshot feeds four analysts in parallel. All reports go to the aggregator and separately to risk. Risk also receives the sized plan. Vetoed orders stop; only approved orders reach the treasurer and chain.</desc><defs><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="marker-purple"/></marker><marker id="arrow-pending" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" class="marker-pending"/></marker></defs>`;
const centers=[200,540,880,1220],snapshotDone=n.snapshot.status==='done';
s+=flowPath('snapshot-stem','M710 67 V84',snapshotDone?'done':'waiting',false);
s+=flowPath('snapshot-bus','M200 84 H1220',snapshotDone?'done':'waiting',false);
data.swarm.agents.forEach((a,i)=>{let st=n[a.id].status==='thinking'?'active':n[a.id].status==='done'?'done':'waiting';s+=flowPath('input-'+a.id,`M${centers[i]} 84 V119`,st)});
const reportPaths=data.swarm.agents.map((a,i)=>({a,i})).sort((x,y)=>Number(n[x.a.id].status==='done')-Number(n[y.a.id].status==='done'));
reportPaths.forEach(({a,i})=>{s+=flowPath('report-'+a.id,`M${centers[i]} 224 V255 H710 V286`,n[a.id].status==='done'?(n.aggregate.status==='thinking'?'active':'done'):'waiting',false)});
s+=flowPath('to-aggregate','M710 255 V286',allDone?(n.aggregate.status==='thinking'?'active':'done'):'waiting');
s+=flowPath('reports-to-risk','M200 255 H28 V405 H460',allDone?(n.risk.status==='thinking'?'active':'done'):'waiting');
s+=flowPath('sized-plan','M710 351 V373',n.aggregate.status==='done'?(n.risk.status==='thinking'?'active':'done'):'waiting');
s+=flowPath('approved','M710 439 V511',n.risk.status==='done'?(n.treasurer.status==='thinking'?'active':'done'):'waiting');
const firstVetoed=(data.risk.orders.find(o=>o.status==='vetoed')||{}).id;const vetoed=firstVetoed&&c.orders[firstVetoed]==='vetoed';s+=flowPath('refusal','M960 405 H1080',vetoed?'refused':'waiting',false);if(vetoed)s+='<path class="stop-bar" d="M1080 390 V420"/>';
s+=flowPath('to-chain','M930 540 H1110',n.treasurer.status==='done'?(n.chain.status==='thinking'?'active':'done'):'waiting');
s+=svgText(51,35,'Same input · No messages between agents','flow-label');
s+=stageNode('snapshot',470,10,480,57,snapshotDone?'Frozen market snapshot':'Market snapshot',snapshotDone?short(data.swarm.snapshot.hash):n.snapshot.status==='thinking'?'Freezing one immutable market view…':'Hash appears when the snapshot resolves',{focus:snapshotDone||n.snapshot.status==='thinking',chip:snapshotDone?'Done · '+elapsed(n.snapshot.elapsed):n.snapshot.status==='thinking'?'Freezing':'Waiting',mono:snapshotDone,action:'snapshot-details'});
data.swarm.agents.forEach((a,i)=>{const x=50+i*340,an=n[a.id],done=an.status==='done',thinking=an.status==='thinking',abstained=done&&!!a.abstention;const chip=done?a.primaryCall.asset+' · '+a.primaryCall.call:thinking?'Thinking':'Waiting';s+=`<g class="node ${thinking?'active':done?'complete':'waiting'} ${abstained?'abstained':''}" role="button" tabindex="0" data-report="${esc(a.id)}" aria-label="${esc(a.seat)} report"><rect class="node-surface" x="${x}" y="119" width="300" height="105" rx="12"/>${svgText(x+17,146,a.seat,'node-title')}${svgText(x+17,170,short(a.wallet),'node-wallet')}<rect class="node-chip" x="${x+17}" y="185" width="143" height="26" rx="7"/>${svgText(x+88,203,chip,'node-chip-text','text-anchor="middle"')}${svgText(x+282,203,(done?'Done · ':thinking?'':'')+((done||thinking)?elapsed(nodeTime(a.id)):''),'node-time',`text-anchor="end" data-elapsed="${a.id}" data-prefix="${done?'Done · ':''}"`)}</g>`;if(abstained)s+=`<rect x="${x+34}" y="228" width="255" height="20" rx="7" fill="#eeecf1"/>${svgText(x+162,242,a.abstention.asset+' abstained · Stale quote','flow-label','text-anchor="middle"')}`});
const aggDesc=n.aggregate.status==='done'?data.swarm.weights:n.aggregate.status==='thinking'?'Applying fixed scoring and sizing rules…':'Waiting for all four signed reports';
s+=stageNode('aggregate',460,286,500,65,'Deterministic aggregator',aggDesc,{focus:n.aggregate.status==='thinking',chip:'auto',action:'allocation-details'});
if(n.aggregate.status==='done')s+=`<rect class="annotation" x="658" y="353" width="104" height="17"/>${svgText(710,365,'Sized plan','flow-label purple','text-anchor="middle"')}`;
s+=`<rect class="annotation" x="85" y="377" width="220" height="19"/>${svgText(90,391,'All four signed reports','flow-label'+(allDone?' purple':''))}`;
let riskDesc='Waiting for reports and sized plan';if(n.risk.status==='thinking')riskDesc=Object.keys(c.orders).length+' of '+data.risk.orders.length+' orders checked · '+(Object.keys(c.orders).length===data.risk.orders.length?'Signing verdict':'Reviewing each order');if(n.risk.status==='done')riskDesc='Signed · Microsoft approved; Nvidia vetoed';
s+=stageNode('risk',460,373,500,66,'Risk agent',riskDesc,{focus:n.risk.status==='thinking',chip:'auto',action:'risk-details'});
if(vetoed)s+=`<g class="node blocked" role="button" tabindex="0" data-action="veto-details"><rect class="node-surface" x="1099" y="374" width="310" height="65" rx="12"/>${svgText(1114,399,vetoOrder.asset+' '+vetoOrder.side.toLowerCase()+' · Vetoed','node-title')}${svgText(1114,424,vetoOrder.proposed+'% exceeds the '+vetoOrder.allowed+'% limit','node-meta')}</g>`;else s+=svgText(1110,410,'Refused orders stop here','flow-label');
const firstApproved=(data.risk.orders.find(o=>o.status==='approved')||{}).id;if(firstApproved&&c.orders[firstApproved]==='approved')s+=`<rect x="544" y="453" width="332" height="29" rx="10" fill="#eee7fd"/>${svgText(710,473,'01  '+approvedOrder.asset+' '+approvedOrder.side.toLowerCase()+' approved · '+money(approvedOrder.amount,0),'node-chip-text','text-anchor="middle"')}`;else s+=`<rect class="annotation" x="592" y="458" width="236" height="22"/>${svgText(710,473,'Only approved orders continue','flow-label','text-anchor="middle"')}`;
if(n.risk.status==='thinking'&&firstApproved&&c.orders[firstApproved])s+=svgText(489,497,'Treasurer waits for signed verdict','flow-label');
s+=stageNode('treasurer',490,511,440,62,'Treasurer · Only node that spends',n.treasurer.status==='done'?'Filled the approved orders on paper':n.treasurer.status==='thinking'?'Executing the approved sale…':'Waiting for risk clearance',{focus:n.treasurer.status!=='waiting',elapsed:true,action:'transaction'});
s+=stageNode('chain',1110,511,300,62,data.app.network,n.chain.status==='done'?'Confirmed · '+short(data.chain.transaction):n.chain.status==='thinking'?'Awaiting transaction receipt…':'No transaction submitted',{focus:n.chain.status==='thinking',chip:'auto',action:'transaction'});
s+='</svg>';$('#flow-container').innerHTML=s;updateFlowChrome();updateElapsedText();}
function updateFlowChrome(){const stage=cycle.stage;$$('[data-stage]').forEach(el=>{const i=+el.dataset.stage;el.className=(cycle.status==='done'||i<stage)?'complete':i===stage?'active':'';if(i===stage)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});const label={idle:'Ready to run',snapshot:'Freezing snapshot',analysts:'Analysts working in parallel',aggregate:'Sizing proposed weights',risk:'Risk review in progress',execute:'Executing approved orders',done:'Cycle complete'}[cycle.status]||'Cycle in progress';$('#cycle-status').textContent=label+(cycle.running?' · '+elapsed(cycle.elapsed/1000):'');const run=$('[data-action="run-cycle"]');run.disabled=cycle.running;run.textContent=cycle.running?'Cycle running · '+elapsed(cycle.elapsed/1000):cycle.status==='done'?'Run another cycle →':'Run a cycle →';const reset=$('[data-action="reset-cycle"]');reset.disabled=cycle.running;$('#flow-signature').textContent=cycle.status==='done'?data.app.decisionId+' · Signature verified':'';$('#flow-caption').textContent=cycle.status==='done'?'One approved sale executed. The vetoed purchase was never submitted.':cycle.status==='idle'?'Run the local example to watch each decision become evidence.':'Published reports below remain available while the cycle replays.';}
function updateElapsedText(){$$('[data-elapsed]').forEach(el=>{const id=el.dataset.elapsed,n=cycle.nodes[id];if(!n)return;el.textContent=n.status==='waiting'?'':(el.dataset.prefix||'')+elapsed(nodeTime(id))})}
function announce(s){$('#cycle-announcement').textContent=s}
function startNode(id){cycle.nodes[id]={status:'thinking',started:cycle.elapsed,elapsed:0}}
function doneNode(id,e){const old=cycle.nodes[id];cycle.nodes[id]={...old,status:'done',elapsed:e??nodeTime(id)}}
/* Public event adapter. Integrations can call this without using the demo clock.
   Dependency guards prevent spending before the complete signed risk verdict. */
function applyProgressEvent(e){if(!e||typeof e.type!=='string')throw new Error('A progress event requires a type.');if(Number.isFinite(e.at))cycle.elapsed=Math.max(cycle.elapsed,e.at);
 switch(e.type){
 case 'snapshot.start':cycle.stage=0;cycle.status='snapshot';startNode('snapshot');announce('Freezing one market snapshot.');break;
 case 'snapshot.done':if(e.hash)data.swarm.snapshot.hash=e.hash;doneNode('snapshot',e.elapsed);announce('Snapshot frozen.');break;
 case 'analysts.start':if(cycle.nodes.snapshot.status!=='done')throw new Error('Snapshot must resolve before analysts start.');cycle.stage=1;cycle.status='analysts';data.swarm.agents.forEach(a=>startNode(a.id));announce('Four analysts started in parallel.');break;
 case 'analyst.done':if(!data.swarm.agents.some(a=>a.id===e.agent))throw new Error('Unknown analyst.');if(cycle.nodes[e.agent].status==='waiting')throw new Error('Analyst has not started.');doneNode(e.agent,e.elapsed);announce(data.swarm.agents.find(a=>a.id===e.agent).seat+' report complete.');break;
 case 'aggregate.start':if(!data.swarm.agents.every(a=>cycle.nodes[a.id].status==='done'))throw new Error('All reports must complete before aggregation.');cycle.stage=2;cycle.status='aggregate';startNode('aggregate');announce('All reports complete. Aggregating target weights.');break;
 case 'aggregate.done':doneNode('aggregate',e.elapsed);break;
 case 'risk.start':if(cycle.nodes.aggregate.status!=='done')throw new Error('Risk needs the sized plan.');cycle.stage=3;cycle.status='risk';startNode('risk');announce('Risk is reviewing every report and the sized plan.');break;
 case 'order.resolved':if(cycle.nodes.risk.status!=='thinking')throw new Error('Order resolutions require an active risk review.');if(!data.risk.orders.some(o=>o.id===e.order)||!['approved','vetoed'].includes(e.verdict))throw new Error('Unknown order or verdict.');cycle.orders[e.order]=e.verdict;announce(e.order.replace('-',' ')+' '+e.verdict+'.');break;
 case 'risk.done':if(!data.risk.orders.every(o=>cycle.orders[o.id]))throw new Error('Every planned order needs a verdict.');doneNode('risk',e.elapsed);announce('Risk verdict signed. Only approved orders may proceed.');break;
 case 'treasurer.start':if(cycle.nodes.risk.status!=='done')throw new Error('Treasurer cannot spend before risk signs.');cycle.stage=4;cycle.status='execute';startNode('treasurer');announce('Treasurer executing the approved sale.');break;
 case 'treasurer.done':doneNode('treasurer',e.elapsed);break;
 case 'chain.start':if(cycle.nodes.treasurer.status!=='done')throw new Error('Submission must precede confirmation.');startNode('chain');announce('Transaction submitted. Awaiting receipt.');break;
 case 'chain.done':if(e.transaction)data.chain.transaction=e.transaction;doneNode('chain',e.elapsed);announce('Transaction confirmed on the demo chain.');break;
 case 'cycle.done':if(cycle.nodes.chain.status!=='done')throw new Error('Cycle needs a transaction receipt.');cycle.status='done';cycle.running=false;stopTimers();announce('Cycle complete. '+data.app.decisionId+' signed. One approved sale, one vetoed purchase.');break;
 default:throw new Error('Unknown progress event: '+e.type);
 }renderFlow();return cycle;
}
function stopTimers(){if(timelineTimer)clearTimeout(timelineTimer);if(tickTimer)clearInterval(tickTimer);timelineTimer=tickTimer=null}
function runCycle(){if(cycle.running)return;stopTimers();cycle=freshCycle();cycle.running=true;cycle.startTime=performance.now();eventIndex=0;renderFlow();function advance(){cycle.elapsed=performance.now()-cycle.startTime;while(eventIndex<CYCLE_TIMELINE.length&&CYCLE_TIMELINE[eventIndex].at<=cycle.elapsed){const e=CYCLE_TIMELINE[eventIndex++];applyProgressEvent(e)}if(cycle.running){const next=CYCLE_TIMELINE[eventIndex];timelineTimer=setTimeout(advance,next?Math.max(0,next.at-cycle.elapsed):50)}}tickTimer=setInterval(()=>{if(!cycle.running)return;cycle.elapsed=performance.now()-cycle.startTime;updateElapsedText();updateFlowChrome()},100);advance()}
function resetCycle(){if(cycle.running)return;stopTimers();cycle=freshCycle();renderFlow();announce('Cycle reset. Ready to run.');}

/* NAVIGATION, DETAIL VIEWS AND LOCAL-ONLY INTERACTIONS */
const renderers={overview:renderOverview,swarm:renderSwarm,decision:renderDecision,risk:renderRisk,books:renderBooks,record:renderRecord,chain:renderChain};
function renderAll(){document.title=data.app.product+' — A fund that shows its work';$('.top-nav').innerHTML=data.app.nav.map(n=>`<a href="#${n.toLowerCase()}" data-page="${n.toLowerCase()}">${esc(n)}</a>`).join('');$('#network-name').textContent=data.app.network;$('#network-mode').textContent=data.app.mode;$('#footer-cycle').textContent='Cycle '+data.app.cycle+' · '+data.app.timestamp;$('#main').innerHTML=Object.entries(renderers).map(([id,r])=>`<section class="page" id="page-${id}" aria-label="${id}" hidden>${r()}</section>`).join('');renderFlow();route(false)}
function renderSection(name){const section=$('#page-'+name);section.innerHTML=renderers[name]();if(name==='swarm')renderFlow()}
function route(scroll=true){const key=location.hash.slice(1).toLowerCase();currentPage=renderers[key]?key:'overview';$$('.page').forEach(p=>p.hidden=p.id!=='page-'+currentPage);$$('.top-nav a').forEach(a=>{if(a.dataset.page===currentPage)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title=currentPage.charAt(0).toUpperCase()+currentPage.slice(1)+' · Openfund';if(scroll)window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',()=>route());
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('visible'),2600)}
async function copy(s){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(s);else{const el=document.createElement('textarea');el.value=s;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();if(!document.execCommand('copy'))throw new Error('Copy unavailable');el.remove()}toast('Copied to clipboard')}catch{showDialog('Copy value',`<p class="small muted">Select and copy the full value below.</p><pre class="code-preview" tabindex="0">${esc(s)}</pre>`)}}
function showDialog(title,html){returnFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;const dialog=$('#detail-dialog');if(!dialog.open)dialog.showModal()}
function closeDialog(){const d=$('#detail-dialog');d.close();if(returnFocus&&returnFocus.isConnected)returnFocus.focus()}
$('#detail-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function showReport(id){const a=data.swarm.agents.find(a=>a.id===id);if(!a)return;showDialog(a.seat,`<div class="small muted">${esc(data.app.decisionId)} · Independent signed report</div><div class="calls">${a.calls.map(callBadge).join('')}</div>${metadata([['Analyst wallet',hash(a.wallet)],['Snapshot',hash(data.swarm.snapshot.hash)]])}<div class="detail-grid"><div class="detail-stat">Confidence<strong>${esc(a.confidence)}</strong></div><div class="detail-stat">Inference cost<strong>${money(a.cost,3)}</strong></div><div class="detail-stat">Latency<strong>${elapsed(a.latency)}</strong></div></div><div class="report-prose">${a.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${a.abstention?`<div class="abstention"><strong>${esc(a.abstention.asset)} · Deliberately abstained</strong>${esc(a.abstention.reason)}</div>`:''}</div><div class="row-divider"></div>${metadata([['Report signature',hash(a.signature)]])}<p class="tiny muted">Illustrative signed report. Signature bytes are placeholders in this offline demo.</p>`)}
function recordPayload(){return {demo:true,decisionId:data.record.id,createdAt:data.app.timestamp,snapshot:{hash:data.record.snapshot,block:data.app.snapshotBlock},reports:data.swarm.agents,allocation:data.decision,risk:data.risk,execution:data.chain,signer:data.record.signer,signature:data.record.signature,payloadHash:data.record.payloadHash}}
function downloadRecord(){const blob=new Blob([JSON.stringify(recordPayload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=data.record.id+'-demo-record.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo record downloaded. No payment was made.')}
function showTransaction(){const d=data.chain,s=d.swaps||[],w=s[selectedSwap]||s[0]||{};showDialog('Transaction receipt',`${badge('Confirmed · read from the chain receipt')}<div class="row-divider"></div>${metadata([['Transaction',hash(w.transaction)],['Fund wallet',hash(w.wallet)],['Gave',esc(w.gave)+' '+esc(w.gaveSymbol)],['Block',num(w.block)],['Confirmed at',esc(w.timestamp)],['Authorised by',esc(w.instruction)],['Gas','Sponsored by the bundler']])}<p class="small muted">${esc(w.reason||'')}</p>`)}
const actions={
 'run-cycle':runCycle,'reset-cycle':resetCycle,'close-dialog':closeDialog,
 'demo-info':()=>showDialog('About this demo',`<p>${esc(data.app.demoNotice)}</p>`),
 'snapshot-details':()=>showDialog('Frozen market snapshot',`${metadata([['Snapshot hash',hash(data.swarm.snapshot.hash)],['Block',num(data.swarm.snapshot.block)],['Frozen at',esc(data.app.timestamp)]])}<p>Every analyst receives this same immutable input. Analysts do not exchange messages or modify another seat’s report.</p>`),
 'source-reports':()=>showDialog('Signed source reports',`<div class="order-list">${data.swarm.agents.map(a=>`<button class="order-item" data-report="${esc(a.id)}"><div><strong>${esc(a.seat)}</strong><div class="small muted">${esc(a.confidence)} confidence · ${money(a.cost,3)} · ${elapsed(a.latency)}</div></div><span class="purple">Read →</span></button>`).join('')}</div>`),
 'allocation-details':()=>{location.hash='decision'},'risk-details':()=>{location.hash='risk'},
 'veto-details':()=>{selectedOrder=(data.risk.orders.find(o=>o.status==='vetoed')||{}).id;renderSection('risk');location.hash='risk'},
 'verify-record':()=>showDialog('Signed decision record',`${badge('Signature verified · Demo state')}<p class="small muted" style="margin-top:16px">This is the verification presentation for a signed record. The static demo contains illustrative bytes; it does not perform cryptographic verification.</p>${metadata([['Decision',esc(data.record.id)],['Signer',hash(data.record.signer)],['Snapshot',hash(data.record.snapshot)],['Payload hash',hash(data.record.payloadHash)]])}<h3>Full signature</h3><pre class="code-preview">${esc(data.record.signature)}</pre><button class="btn secondary" data-copy="${esc(data.record.signature)}">Copy signature</button>`),
 'record-details':()=>showDialog('Record preview',`<p>${esc(data.record.headline)}</p><pre class="code-preview">${esc(JSON.stringify({id:data.record.id,createdAt:data.app.timestamp,snapshotHash:data.record.snapshot,approvedOrders:data.record.approved,vetoedOrders:data.record.vetoed,signer:data.record.signer,payloadHash:data.record.payloadHash,priceUSD:data.record.price},null,2))}</pre><button class="btn" data-action="${recordUnlocked?'download-record':'checkout'}">${recordUnlocked?'Download demo record':'Unlock full record — '+money(data.record.price)}</button>`),
 'checkout':()=>showDialog('Unlock the complete record',`<div style="font-size:44px;font-weight:700;letter-spacing:-1px">${money(data.record.price)}</div><p>All four analyst reports, the allocation breakdown, the risk verdict and the transaction receipt.</p><div class="abstention"><strong>Preview checkout</strong>This standalone demo has no wallet connection or payment service. Continue to inspect the complete demo payload without paying.</div><div class="button-row"><button class="btn" data-action="unlock-demo">Unlock demo record →</button><button class="btn secondary" data-action="close-dialog">Cancel</button></div>`),
 'unlock-demo':()=>{recordUnlocked=true;closeDialog();renderSection('record');toast('Demo record unlocked. No payment was made.')},'download-record':downloadRecord,'transaction':showTransaction,
 'explorer':()=>openExplorer((((data.chain.swaps||[])[selectedSwap])||(data.chain.swaps||[])[0]||{}).explorerUrl,'transaction'),'wallet-explorer':()=>openExplorer(data.chain.walletExplorerUrl,'wallet')
};
function openExplorer(url,type){if(url&&/^https:\/\//.test(url))window.open(url,'_blank','noopener,noreferrer');else showDialog(type==='wallet'?'Fund wallet':'Block explorer',`<p>This ${type} is an illustrative placeholder. No live explorer URL is configured.</p><div class="row-divider"></div>${metadata([[type==='wallet'?'Fund wallet':'Transaction',hash(type==='wallet'?data.chain.wallet:data.chain.transaction)]])}<p class="small muted">A connected deployment can open its real receipt here.</p>`)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-copy],[data-report],[data-select-asset],[data-select-order],[data-select-swap],[data-book]');if(!el||el.disabled)return;if(el.dataset.copy!==undefined){copy(el.dataset.copy);return}if(el.dataset.report){showReport(el.dataset.report);return}if(el.dataset.selectSwap!==undefined){selectedSwap=+el.dataset.selectSwap;renderSection('chain');return}
 if(el.dataset.selectAsset){selectedAsset=el.dataset.selectAsset;$$('[data-select-asset]').forEach(r=>r.classList.toggle('selected',r.dataset.selectAsset===selectedAsset));$('#decision-trace').innerHTML=renderTrace();return}if(el.dataset.selectOrder){selectedOrder=el.dataset.selectOrder;$('#risk-order-list').innerHTML=orderList();$('#risk-detail').innerHTML=riskDetail();return}if(el.dataset.book){const b=data.books.books.find(b=>b.id===el.dataset.book);showDialog(b.name,`${bookCard(b)}<p class="small muted" style="margin-top:20px">This book is reconciled independently. It is never combined with the other book.</p>`);return}const fn=actions[el.dataset.action];if(fn)fn()});
document.addEventListener('keydown',e=>{const el=e.target.closest('tr[data-select-asset],g[role=button]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.addEventListener('pagehide',stopTimers);
window.Openfund={
 runCycle,resetCycle,applyProgressEvent,
 getCycleState:()=>JSON.parse(JSON.stringify(cycle)),
 getData:()=>JSON.parse(JSON.stringify(data)),
 setData(name,payload){if(!Object.hasOwn(data,name)||!payload||typeof payload!=='object')throw new Error('Use a known section name and a JSON object.');if(cycle.running)throw new Error('Finish or cancel the active cycle before replacing data.');data[name]=JSON.parse(JSON.stringify(payload));if(name==='swarm')cycle=freshCycle();renderAll()},
 beginLiveCycle(){stopTimers();cycle=freshCycle();cycle.running=true;cycle.startTime=performance.now();renderFlow();tickTimer=setInterval(()=>{cycle.elapsed=performance.now()-cycle.startTime;updateElapsedText();updateFlowChrome()},100)},
 cancelCycle(){stopTimers();cycle=freshCycle();renderFlow()},
 timeline:JSON.parse(JSON.stringify(CYCLE_TIMELINE))
};
renderAll();
</script>
