[project]
name = "openfund"
version = "0.0.0"
description = "An onchain fund that holds tokenized equities on Robinhood Chain and shows its work"
requires-python = ">=3.11"

# Dependencies are added by the unit that first needs them, pinned exactly, so
# the dependency list stays readable as a record of what the system actually
# reaches for. Unit 0.1 was stdlib only.
dependencies = [
    # 3.7: ed25519 for the decision record's signature, in treasurer/sign.py only.
    "cryptography==46.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
